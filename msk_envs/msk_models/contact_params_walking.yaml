#  Ground-feet contacts are based on calibrated contact parameters for sprinting
#  (https://pmc.ncbi.nlm.nih.gov/articles/PMC7950206/)
#  Other contacts are given high stiffness and dissipation to prevent penetration
ground:
  stiffness: 5e5
  dissipation: 1.0
  priority: 0
  static_friction: 0.8
  dynamic_friction: 0.8
  viscous_friction: 0.0
  transition_velocity: 0.1

